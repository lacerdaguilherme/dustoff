# Known applications: where they keep config/data, and what name proves they
# are installed (package, binary, /opt dir, Flatpak/Snap id or AppImage name).
# Matching ignores case and punctuation: "Google-Chrome" == "googlechrome".
# If none of `names` is found installed, the `dirs` are reported as orphaned
# with HIGH confidence. Dirs must start with "~/" and sit >= 2 levels deep.

[[app]]
id = "chrome"
name = "Google Chrome"
dirs = ["~/.config/google-chrome", "~/.cache/google-chrome"]
names = ["google-chrome", "google-chrome-stable", "chrome"]

[[app]]
id = "edge"
name = "Microsoft Edge"
dirs = ["~/.config/microsoft-edge", "~/.cache/microsoft-edge"]
names = ["microsoft-edge", "microsoft-edge-stable", "msedge"]

[[app]]
id = "firefox"
name = "Firefox"
dirs = ["~/.mozilla/firefox", "~/.cache/mozilla/firefox"]
names = ["firefox"]

[[app]]
id = "vscode"
name = "Visual Studio Code"
dirs = ["~/.config/Code", "~/.vscode"]
names = ["code", "vscode", "visual-studio-code"]

[[app]]
id = "cursor"
name = "Cursor"
dirs = ["~/.config/Cursor", "~/.cursor"]
names = ["cursor"]

[[app]]
id = "slack"
name = "Slack"
dirs = ["~/.config/Slack"]
names = ["slack", "slack-desktop"]

[[app]]
id = "discord"
